name: WDIO tests (BrowserStack)

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: BrowserStack app URL (bs://...) of the QA flavor build
        required: true
      platform:
        description: android or ios
        default: android
      lang:
        description: en or ar
        default: en
      tags:
        description: E2E_TAGS filter (e.g. smoke, p0, signIn)
        default: smoke

jobs:
  wdio:
    runs-on: macos-13
    timeout-minutes: 260
    env:
      E2E_ENV: dev
      E2E_ENCRYPTION: 'true'
      E2E_TARGET: browserstack
      PLATFORM: ${{ inputs.platform }}
      E2E_LANG: ${{ inputs.lang }}
      E2E_TAGS: ${{ inputs.tags }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BROWSERSTACK_APP_URL: ${{ inputs.platform == 'android' && inputs.app_url || '' }}
      BROWSERSTACK_APP_URL_IOS: ${{ inputs.platform == 'ios' && inputs.app_url || '' }}
      E2E_CUSTOMER_PHONE: ${{ secrets.E2E_CUSTOMER_PHONE }}
      E2E_CUSTOMER_OTP: ${{ secrets.E2E_CUSTOMER_OTP }}
      BUILD_NAME: madark-e2e-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify:locators
      - run: npm run verify:crypto
      - run: npm run verify:api
      - run: npx wdio run wdio.conf.ts
      - if: always()
        run: npx allure generate allure-results --clean -o allure-report
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ inputs.platform }}-${{ inputs.lang }}
          path: allure-report
