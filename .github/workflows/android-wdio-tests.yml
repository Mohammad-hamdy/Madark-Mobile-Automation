name: Android WDIO tests (emulator on runner)

# Local Appium + Android emulator on the GitHub runner.
# QA APK (com.madark.institution.qa) via apk_run_id (mobile repo artifact) or apk_url.

on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: Mobile-repo build run ID that uploaded the APK (leave empty to use apk_url)
        required: false
        type: string
      apk_artifact:
        description: Artifact name in that run
        required: false
        default: madark-apk-qa
        type: string
      apk_url:
        description: Direct APK download URL (used when apk_run_id is empty)
        required: false
        type: string
      lang:
        description: App language (en or ar)
        required: false
        default: ar
        type: choice
        options: [ar, en]
      tags:
        description: E2E_TAGS filter (e.g. 11874, smoke, signIn, p0)
        required: false
        default: '11874'
        type: string
      spec:
        description: Optional WDIO --spec path (speeds up single-case runs)
        required: false
        default: './specs/sign-in/sign-in.spec.ts'
        type: string
      api_level:
        description: Emulator Android API level
        required: false
        default: '34'
        type: string
      skip_api_verify:
        description: Skip encrypted Dev API pre-check (UI-only cases like 11874)
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types: [madark-apk-ready]

concurrency:
  group: android-wdio-${{ github.ref }}-${{ github.event.inputs.tags || github.event.client_payload.tags || 'default' }}
  cancel-in-progress: false

env:
  MOBILE_REPO: Madark/Madarak-UserApp
  APPIUM_PORT: '4725'

jobs:
  android-wdio:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      E2E_ENV: dev
      E2E_ENCRYPTION: 'true'
      E2E_TARGET: local
      PLATFORM: android
      E2E_LANG: ${{ inputs.lang || github.event.client_payload.lang || 'ar' }}
      E2E_TAGS: ${{ inputs.tags || github.event.client_payload.tags || '11874' }}
      ANDROID_UDID: emulator-5554
      APPIUM_HOST: 127.0.0.1
      ANDROID_APP_PATH: ${{ github.workspace }}/app/madark-qa.apk
      E2E_CUSTOMER_PHONE: ${{ secrets.E2E_CUSTOMER_PHONE }}
      E2E_CUSTOMER_OTP: ${{ secrets.E2E_CUSTOMER_OTP }}
      E2E_SKIP_UNSUPPORTED_DEVICE_ACTIONS: '1'
      E2E_FAST: '1'
      WDIO_WALL_TIMEOUT: '480'
      # Graceful emu kill often hangs on GHA — keep this tiny; script also force-kills qemu.
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: '1'
      WDIO_SPEC: ${{ inputs.spec || github.event.client_payload.spec || './specs/sign-in/sign-in.spec.ts' }}

    steps:
      - name: Checkout automation
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Appium driver
        run: |
          npm ci
          npx appium driver install uiautomator2

      - name: Static checks (no device)
        run: |
          npm run typecheck
          npm run verify:locators
          npm run verify:crypto

      - name: Encrypted Dev API check
        if: ${{ inputs.skip_api_verify != true && github.event.client_payload.skip_api_verify != true }}
        run: npm run verify:api

      - name: Download APK from mobile repo build
        if: ${{ inputs.apk_run_id != '' || github.event.client_payload.run_id != '' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.MOBILE_REPO_TOKEN }}
          repo: ${{ env.MOBILE_REPO }}
          run_id: ${{ inputs.apk_run_id || github.event.client_payload.run_id }}
          name: ${{ inputs.apk_artifact || github.event.client_payload.artifact || 'madark-apk-qa' }}
          path: app

      - name: Download APK from URL
        if: ${{ inputs.apk_run_id == '' && github.event.client_payload.run_id == '' }}
        env:
          # Default: QA APK release asset in this repo (apk-qa-1.0.7-83)
          APK_URL: ${{ inputs.apk_url || github.event.client_payload.apk_url || secrets.MADARK_QA_APK_URL || 'https://github.com/Mohammad-hamdy/Madark-Mobile-Automation/releases/download/apk-qa-1.0.7-83/madark-qa.apk' }}
          APK_URL_TOKEN: ${{ secrets.APK_URL_TOKEN || github.token }}
        run: |
          set -euo pipefail
          test -n "${APK_URL:-}" || { echo "::error::Provide apk_run_id, apk_url, or secret MADARK_QA_APK_URL"; exit 1; }
          mkdir -p app
          if [ -n "${APK_URL_TOKEN:-}" ]; then
            curl -fsSL -H "Authorization: Bearer $APK_URL_TOKEN" -L -o "$ANDROID_APP_PATH" "$APK_URL"
          else
            curl -fsSL -L -o "$ANDROID_APP_PATH" "$APK_URL"
          fi

      - name: Normalise APK path
        run: |
          set -euo pipefail
          found="$(find app -name '*.apk' | head -1)"
          test -n "$found" || { echo "::error::No APK found under app/"; exit 1; }
          [ "$found" = "app/madark-qa.apk" ] || mv "$found" "$ANDROID_APP_PATH"
          ls -lah "$ANDROID_APP_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ inputs.api_level || '34' }}-google_apis-x86_64

      # One emulator boot only (snapshot pre-warm was a 2nd boot + hung Terminate Emulator).
      - name: Run WebdriverIO on emulator
        id: wdio
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '34' }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Runner executes script line-by-line — keep a single call into a bash file.
          script: bash scripts/ci-android-wdio.sh

      - name: Generate Allure single-file report
        if: always()
        run: |
          set -euo pipefail
          mkdir -p allure-html
          if [ -d allure-results ] && ls allure-results/*-result.json >/dev/null 2>&1; then
            npx allure generate --single-file allure-results -o allure-html --clean
            cp allure-html/index.html "allure-html/allure-report-${{ github.run_number }}.html"
          else
            echo "::warning::No allure-results to generate"
          fi

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-html/allure-report-${{ github.run_number }}.html
          if-no-files-found: ignore

      - name: Upload raw results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: |
            allure-results
            logs
            generated/missing.locator
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "### Android WDIO — ${E2E_ENV} / encryption=${E2E_ENCRYPTION} / ${E2E_LANG} / tags=${E2E_TAGS:-all}"
            echo ""
            echo "- Spec: \`${WDIO_SPEC:-all}\`"
            echo "- WDIO exit: \`${{ steps.wdio.outputs.wdio_exit || 'n/a' }}\`"
            echo ""
            total=$(ls allure-results/*-result.json 2>/dev/null | wc -l | tr -d ' ')
            passed=$(grep -l '"status":"passed"' allure-results/*-result.json 2>/dev/null | wc -l | tr -d ' ')
            failed=$(grep -lE '"status":"(failed|broken)"' allure-results/*-result.json 2>/dev/null | wc -l | tr -d ' ')
            skipped=$(grep -l '"status":"skipped"' allure-results/*-result.json 2>/dev/null | wc -l | tr -d ' ')
            echo "| Total | Passed | Failed | Skipped |"
            echo "|---|---|---|---|"
            echo "| ${total:-0} | ${passed:-0} | ${failed:-0} | ${skipped:-0} |"
            echo ""
            echo "Report artifact: \`allure-report-${{ github.run_number }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
